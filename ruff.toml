# Ruff settings for the repository's Python scripts (stdlib only, Python 3.10+).
target-version = "py310"
line-length = 100
include = ["*.py"]
force-exclude = true

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter handles line length; long strings stay readable

[format]
quote-style = "double"
