# Ruff settings for the repository's Python scripts (stdlib only, Python 3.10+, the sizer's script 3.9+).
target-version = "py310"
line-length = 100
include = ["*.py"]
force-exclude = true

# The sizer's script runs in users' own Python, which on a Mac can be the system's 3.9.
[per-file-target-version]
"skills/*/scripts/*.py" = "py39"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter handles line length; long strings stay readable

[format]
quote-style = "double"
