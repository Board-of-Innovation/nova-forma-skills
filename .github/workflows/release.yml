name: Release

# Runs when a maintainer pushes a version tag such as v1.0.0. It builds one zip
# per skill and publishes them on a GitHub release with stable asset names, so
# https://github.com/Board-of-Innovation/nova-forma-skills/releases/latest/download/<skill-name>.zip
# always points at the newest version. Releases are immutable once published,
# so the workflow creates a draft, attaches the zips, and only then publishes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build the skill zips and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version in plugin.json
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in .claude-plugin/plugin.json. Delete the tag, then tag v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Repository checks
        run: python3 scripts/check.py

      - name: Build the skill zips
        run: python3 scripts/build_zips.py

      - name: Write the release notes from CHANGELOG.md
        run: |
          # The section under "## [X.Y.Z]" up to the next "## " heading,
          # without the link definitions at the bottom of the file.
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "## [" ver "]") == 1 || $0 == "## " ver || index($0, "## " ver " ") == 1) { found = 1; next }
            }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release uses generated notes."
          fi

      - name: Create a draft release, attach the zips, then publish
        run: |
          set -euo pipefail
          if [ -n "${NOTES_FILE:-}" ]; then
            notes=(--notes-file "$NOTES_FILE")
          else
            notes=(--generate-notes)
          fi
          if [[ "$VERSION" == *-* ]]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi

          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            echo "A draft release for $TAG already exists (an earlier run stopped); reusing it."
          else
            gh release create "$TAG" --draft --verify-tag --title "Nova Forma skills $TAG" "${notes[@]}"
          fi
          gh release upload "$TAG" dist/*.zip --clobber
          gh release edit "$TAG" --draft=false "${kind[@]}"
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
