name: Release

# Runs when a maintainer pushes a version tag such as v1.0.0. It checks that the
# tag matches the version in .claude-plugin/plugin.json, runs the repository
# checks, and publishes a GitHub release whose notes are the CHANGELOG.md
# section for that version. The release attaches no files: users install from
# the repository itself, as a plugin marketplace or with npx skills. Releases
# are immutable once published, so the release is created and published in one
# step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check the version and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version in plugin.json
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in .claude-plugin/plugin.json. Delete the tag, then tag v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Repository checks
        run: python3 scripts/check.py

      - name: Write the release notes from CHANGELOG.md
        run: |
          # The section under "## [X.Y.Z]" up to the next "## " heading,
          # without the link definitions at the bottom of the file.
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "## [" ver "]") == 1 || $0 == "## " ver || index($0, "## " ver " ") == 1) { found = 1; next }
            }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release uses generated notes."
          fi

      - name: Publish the release
        run: |
          set -euo pipefail
          if [ -n "${NOTES_FILE:-}" ]; then
            notes=(--notes-file "$NOTES_FILE")
          else
            notes=(--generate-notes)
          fi
          if [[ "$VERSION" == *-* ]]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists, and its tag is locked once published. To ship a correction, release a new patch version. If it is a leftover draft, delete it and run the workflow again."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "Nova Forma skills $TAG" "${notes[@]}" "${kind[@]}"
          gh release view "$TAG" --json url --jq .url
